version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fdr-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fdr_user
      POSTGRES_PASSWORD: fdr_password
      POSTGRES_DB: fdr_trust_ledger
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/api/src/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  api:
    build: ./apps/api
    ports:
      - '3001:3001'
    env_file: .env
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://fdr_user:fdr_password@postgres:5432/fdr_trust_ledger

  mock-bank:
    build: ./apps/mock-bank
    ports:
      - '3002:3002'

  web:
    build: ./apps/web
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  postgres-data:
