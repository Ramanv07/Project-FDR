version: '3.8'

services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  api:
    build: ./apps/api
    ports:
      - '3001:3001'
    env_file: .env
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/fdr-trust-ledger

  mock-bank:
    build: ./apps/mock-bank
    ports:
      - '3002:3002'

  web:
    build: ./apps/web
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  mongo-data:
